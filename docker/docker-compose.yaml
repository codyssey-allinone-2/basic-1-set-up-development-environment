version: '3.8'

networks:
  app-network:
    driver: bridge  # 두 컨테이너가 서로 통신할 수 있는 가상 네트워크

services:
  # 첫 번째 Nginx 컨테이너
  web1:
    image: nginx:latest
    container_name: nginx-web1
    ports:
      - "8081:80"
    environment:
      - APP_MODE=${APP_MODE:-development}  # 서버 모드 주입 (예: dev/prod)
      - SERVER_PORT=${WEB1_PORT:-8080}
    networks:
      - app-network

  # 두 번째 Nginx 컨테이너
  web2:
    image: nginx:latest
    container_name: nginx-web2
    ports:
      - "8082:80"
    environment:
      - APP_MODE=${APP_MODE:-development}
      - SERVER_PORT=${WEB2_PORT:-8081}
    networks:
      - app-network
